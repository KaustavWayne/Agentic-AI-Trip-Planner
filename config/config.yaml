# configuration settings
llm:
  provider: groq
  model: llama-3.1-8b-instant
  temperature: 0.3
  max_tokens: 1500

tools:
  tavily_max_results: 5
  foursquare_limit: 10 
  weather_units: metric

mcp:
  name: "trip-planner-mcp"
  description: "MCP server for Agentic Trip Planning with weather, places, research and expense estimation."